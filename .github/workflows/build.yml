# Builds the shell when the app changes, checks that a kid's app made from it installs (apksigner, aapt2), and puts the shell on the
# «dist» branch, where roboegypt.com takes it. Public repo: no Actions minutes are counted.
name: build
on:
  push:
    branches: [main]
    paths: ['app/**', 'build.sh', 'tools/**', '.github/workflows/build.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Build the shell
        run: ./build.sh
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: A kid's app from the shell, checked by Android's tools
        run: |
          node tools/test.mjs build/robo-apps-shell.apk build/test-app.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --min-sdk-version 24 build/test-app.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging build/test-app.apk | head -5
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -p 4 build/test-app.apk && echo aligned
      - name: Put the shell on the dist branch
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/d && cp build/robo-apps-shell.apk /tmp/d/ && cd /tmp/d && sha256sum robo-apps-shell.apk > robo-apps-shell.sha256
          git init -q && git checkout -q -b dist && git add . && git -c user.name=robo-ci -c user.email=ci@roboegypt.com commit -qm "shell ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" dist
